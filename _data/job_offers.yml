positions:
  - title: "Post-doc position (1,5 years) at University of Dubrovnik"
    institution: "University of Dubrovnik, Dubrovnik, Croatia"
    date: 2026-05-18
    deadline: 2026-07-01
    link: "https://conduction.unidu.hr/postdoc-position/"
    abstract: "Post-doc position (1,5 years) at University of Dubrovnik, within Conduction (Optimal control and model reduction for evolution and data driven problems) project and aligned with the European COST Action CA24136 - Interactions between Control Theory and Machine Learning (InterCoML). The candidate will work on problems related to the Work packages 1 and 2 (Optimal control problems for evolution systems. Spectral analysis of Gramian operators, Lyapunov and Riccati equation) of the project. Special intention will be given to interactions among control theory and machine learning. He/she will be expected to work effectively within the project team, to have the ability to develop and apply new concepts, to write numerical codes and run the simulations, as well as to write clearly and concisely for publication."
  - title: "PhD in Safe AI-based Control at Eindhoven University of Technology"
    institution: "Eindhoven University of Technology, Eindhoven, The Netherlands"
    date: 2026-07-29
    deadline: 2026-08-30
    link: "https://www.tue.nl/en/working-at-tue/vacancy-overview/phd-in-safe-ai-based-control"
    abstract: "In this PhD project, you will develop methods for the analysis, verification, and design of neural-network-based controllers. Rather than treating safety and stability as properties to be assessed only after training, you will investigate safety- and verification-by-design approaches that incorporate certifiable properties directly into the controller architecture and learning process.<br /><br />This project offers a unique opportunity to work at the intersection of machine learning and control theory. You will develop rigorous theory and scalable computational methods for certifying closed-loop safety and stability, with potential directions including control barrier and Lyapunov functions, quadratic constraints, semidefinite programming, and neural-network architectures with intrinsic stability or robustness properties. You will also investigate how physical insight, prior system knowledge, and stabilizing baseline controllers can be combined with learning to improve performance while retaining rigorous guarantees. The developed methods will be evaluated on benchmark problems and more realistic scenarios involving complex dynamical systems."

